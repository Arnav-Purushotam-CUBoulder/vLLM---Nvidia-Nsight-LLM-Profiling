version: "3.8"

services:
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: vllm-phi2
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    ports:
      - "8000:8000"
    command:
      - "--model"
      - "microsoft/phi-2"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "2048"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: "4g"
    restart: unless-stopped
